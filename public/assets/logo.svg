<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PDF Split logo pattern 1</title>
  <desc id="desc">An open book split by a vertical dashed line through the center.</desc>
  <defs>
    <linearGradient id="bg" x1="76" y1="68" x2="436" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e7f2ff"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="100" y1="118" x2="240" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="272" y1="118" x2="412" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#18324a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(256 256) scale(1.12) translate(-256 -256)">
    <path d="M84 128c0-17 15-30 32-27 50 8 97 24 140 50v260c-43-26-90-42-140-50-17-3-32 10-32 27V128Z" fill="url(#leftPage)" stroke="#17324d" stroke-width="12" stroke-linejoin="round"/>
    <path d="M428 128c0-17-15-30-32-27-50 8-97 24-140 50v260c43-26 90-42 140-50 17-3 32 10 32 27V128Z" fill="url(#rightPage)" stroke="#17324d" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <path d="M256 62v388" fill="none" stroke="#f7fbff" stroke-width="24" stroke-linecap="round"/>
  <path d="M256 62v388" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" stroke-dasharray="20 17"/>

  <g transform="translate(256 256) scale(1.12) translate(-256 -256)">
    <path d="M126 164c33 5 66 16 97 32M126 214c33 5 66 16 97 32M126 264c33 5 66 16 97 32M126 314c33 5 66 16 97 32" fill="none" stroke="#9fb2c5" stroke-width="9" stroke-linecap="round"/>
    <path d="M386 164c-33 5-66 16-97 32M386 214c-33 5-66 16-97 32M386 264c-33 5-66 16-97 32M386 314c-33 5-66 16-97 32" fill="none" stroke="#9fb2c5" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
