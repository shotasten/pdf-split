<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PDF見開き分割くん</title>
  <desc id="desc">Social card for PDF見開き分割くん.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcfdff" />
      <stop offset="1" stop-color="#eef6fa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17324d" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="56" y="52" width="1088" height="526" rx="34" fill="rgba(255,255,255,0.52)" stroke="#dbe8ed" />

  <g filter="url(#shadow)">
    <image href="data:image/svg+xml;base64," x="110" y="175" width="250" height="250" preserveAspectRatio="xMidYMid meet" />
  </g>

  <g>
    <text x="430" y="286" fill="#12212b" font-family="Noto Sans CJK JP, Noto Sans CJK, Yu Gothic, Meiryo, sans-serif" font-size="72" font-weight="900" letter-spacing="0.01em">PDF見開き分割くん</text>
    <text x="430" y="352" fill="#5a6c74" font-family="Noto Sans CJK JP, Noto Sans CJK, Yu Gothic, Meiryo, sans-serif" font-size="32" font-weight="900">
      <tspan x="430" dy="0">A3・B4などのPDFを、</tspan>
      <tspan x="600" dy="52">まんなかで2ページに</tspan>
    </text>
  </g>
</svg>
