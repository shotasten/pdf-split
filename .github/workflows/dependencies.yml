name: 依存関係の検証

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 依存関係をlockfileどおりにインストール
        run: npm ci
      - name: 依存関係を監査
        run: npm run audit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
